name: Build macOS distribution (no release)
on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (MAJOR.MINOR.PATCH)
        default: '0.1.0'
        required: true
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    env:
      VIBE_VERSION: ${{ inputs.version || '0.1.0' }}
      VIBE_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VIBE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        run: ./scripts/test.sh
      - name: Build and verify bundle
        run: ./scripts/build.sh
      - name: Package locally
        run: ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Vibe-Statistics-${{ env.VIBE_VERSION }}-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
